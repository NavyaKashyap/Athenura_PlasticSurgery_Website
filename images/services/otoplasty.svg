<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
      
      <rect width="600" height="450" fill="#f7efe7"/>
      <!-- Patient Front Portrait -->
      <circle cx="250" cy="230" r="140" fill="#f5decb"/>
      <path d="M110,180 C110,60 210,30 310,40 C380,50 390,130 390,190 Z" fill="#3c2a20"/>
      <!-- Ear Details -->
      <path d="M125,180 C105,190 100,240 125,260" stroke="#d4b29b" stroke-width="8" fill="none"/>
      <path d="M375,180 C395,190 400,240 375,260" stroke="#d4b29b" stroke-width="8" fill="none"/>
      
      <!-- Doctor holding medical ruler/caliper at ear -->
      <path d="M530,450 L480,250 C460,220 440,210 410,210 L400,225 L450,450 Z" fill="#ffffff"/>
      <!-- Caliper / Ruler vertically aligned with ear -->
      <rect x="395" y="160" width="14" height="120" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
      <line x1="395" y1="180" x2="403" y2="180" stroke="#0e392b" stroke-width="2"/>
      <line x1="395" y1="200" x2="406" y2="200" stroke="#0e392b" stroke-width="2"/>
      <line x1="395" y1="220" x2="403" y2="220" stroke="#0e392b" stroke-width="2"/>
      <line x1="395" y1="240" x2="406" y2="240" stroke="#0e392b" stroke-width="2"/>
      <line x1="395" y1="260" x2="403" y2="260" stroke="#0e392b" stroke-width="2"/>

      <rect x="20" y="390" width="160" height="40" rx="20" fill="#0e392b" opacity="0.9"/>
      <text x="100" y="415" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">OTOPLASTY</text>
    
    </svg>