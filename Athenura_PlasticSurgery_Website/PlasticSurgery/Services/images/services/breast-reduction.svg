<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
      
      <rect width="600" height="450" fill="#f5ede5"/>
      <!-- Patient & Doctor holding Tablet Computer -->
      <!-- Patient Left -->
      <circle cx="160" cy="140" r="48" fill="#f8dfcf"/>
      <path d="M90,450 L90,260 C90,210 140,190 200,190 L240,450 Z" fill="#b9d6ce"/>
      <!-- Doctor Right -->
      <circle cx="450" cy="130" r="48" fill="#f5d6c2"/>
      <path d="M380,450 L420,240 C440,190 500,190 540,240 L540,450 Z" fill="#ffffff"/>

      <!-- Digital Tablet in Center -->
      <rect x="220" y="190" width="160" height="210" rx="12" fill="#0f172a" stroke="#475569" stroke-width="4"/>
      <rect x="230" y="200" width="140" height="190" rx="8" fill="#ffffff"/>
      <text x="300" y="225" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0e392b" text-anchor="middle">Reduction Vectors</text>
      <circle cx="270" cy="275" r="28" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
      <circle cx="330" cy="275" r="28" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
      <path d="M250,290 L290,260" stroke="#0e392b" stroke-width="3" stroke-dasharray="3 3"/>
      <path d="M310,260 L350,290" stroke="#0e392b" stroke-width="3" stroke-dasharray="3 3"/>

      <rect x="20" y="390" width="180" height="40" rx="20" fill="#0e392b" opacity="0.9"/>
      <text x="110" y="415" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">BREAST REDUCTION</text>
    
    </svg>