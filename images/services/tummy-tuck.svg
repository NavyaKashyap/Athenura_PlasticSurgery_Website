<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
      
      <rect width="600" height="450" fill="#f8f2ec"/>
      <!-- Medical Wall Chart showing Abdominal Contouring -->
      <rect x="280" y="30" width="280" height="360" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
      <text x="420" y="60" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0e392b" text-anchor="middle">Abdominoplasty Assessment</text>
      <!-- Waistline contour vectors -->
      <path d="M350,110 C390,140 390,200 350,240" stroke="#0e392b" stroke-width="4" stroke-dasharray="5 3" fill="none"/>
      <path d="M490,110 C450,140 450,200 490,240" stroke="#0e392b" stroke-width="4" stroke-dasharray="5 3" fill="none"/>
      <circle cx="420" cy="175" r="8" fill="#ea580c"/>

      <!-- Patient standing by chart -->
      <circle cx="170" cy="150" r="50" fill="#f5d6c2"/>
      <path d="M100,450 L100,270 C100,210 160,200 230,200 L270,450 Z" fill="#b9d6ce"/>

      <rect x="20" y="390" width="160" height="40" rx="20" fill="#0e392b" opacity="0.9"/>
      <text x="100" y="415" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">TUMMY TUCK</text>
    
    </svg>