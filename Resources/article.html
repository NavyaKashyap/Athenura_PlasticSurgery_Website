<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Articles</title>

    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="css/article.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <header id="navbar"></header>

    <main>

        <section class="article-hero">

            <span class="article-category" id="article-category"></span>

            <span class="article-date" id="article-date"></span>

            <h1 id="article-title"></h1>

            <p id="article-description"></p>

        </section>

        <!-- Article Section -->
        <section class="article-section">

            <aside class="article-sidebar">
                <h2>ON THIS PAGE</h2>

                <nav class="article-nav" id="article-nav">
                </nav>

            </aside>

            <!-- </article> -->
            <article class="article-content">

                <div id="article-content-container"></div>

            </article>

        </section>

        <section class="key-takeaways">

            <div class="takeaways-heading">

                <span>KEY TAKEAWAYS</span>

                <h2 id="takeaways-title"></h2>

                <p id="takeaways-description"></p>

            </div>

            <div id="key-takeaways-container"></div>

        </section>

        <section class="specialist-note">

            <div class="specialist-note-inner">

                <div class="specialist-note-label">
                    SPECIALIST NOTE
                </div>

                <div id="specialist-note-container"></div>

            </div>

        </section>


        <!-- Related Resources Section -->
        <section class="related-resources">

            <div class="related-resources-heading">

                <span>KEEP EXPLORING</span>

                <h2>Related Resources</h2>

                <p>
                    Continue learning with these guides to help you feel informed
                    before and after your aesthetic treatment.
                </p>

            </div>


            <div class="related-resources-cards" id="related-resources-container"></div>

        </section>

    </main>

    <footer id="footer"></footer>

    <script src="js/components.js"></script>
    <script src="js/resources.js"></script>
    <script src="js/article-content.js"></script>
    <script src="js/article.js"></script>

</body>

</html>
