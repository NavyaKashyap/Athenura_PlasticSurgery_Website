<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
      
      <rect width="600" height="450" fill="#edf4f8"/>
      <!-- Laser Equipment Console on Left -->
      <rect x="360" y="160" width="200" height="260" rx="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="6"/>
      <rect x="380" y="180" width="160" height="110" rx="8" fill="#38bdf8" opacity="0.85"/>
      <text x="460" y="240" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">LASER SYSTEM</text>

      <!-- Doctor wearing dark protective goggles -->
      <circle cx="180" cy="150" r="55" fill="#f5d6c2"/>
      <!-- Dark Goggles -->
      <ellipse cx="160" cy="145" rx="22" ry="14" fill="#0f172a" stroke="#475569" stroke-width="3"/>
      <ellipse cx="205" cy="145" rx="22" ry="14" fill="#0f172a" stroke="#475569" stroke-width="3"/>
      <line x1="182" y1="145" x2="183" y2="145" stroke="#0f172a" stroke-width="4"/>
      <!-- Doctor Lab Coat & Arm delivering laser handpiece -->
      <path d="M120,450 L140,240 C160,200 230,200 260,250 L290,340 L340,360 Z" fill="#ffffff"/>
      <!-- Handpiece with precision light beam -->
      <rect x="280" y="330" width="40" height="16" rx="4" fill="#334155" transform="rotate(30 280 330)"/>
      <line x1="310" y1="355" x2="335" y2="395" stroke="#ef4444" stroke-width="4"/>

      <rect x="20" y="390" width="180" height="40" rx="20" fill="#0e392b" opacity="0.9"/>
      <text x="110" y="415" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">LASER TREATMENTS</text>
    
    </svg>