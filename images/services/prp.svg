<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
      
      <rect width="600" height="450" fill="#f6efe8"/>
      <!-- Doctor in White Lab Coat (Center/Right) -->
      <path d="M260,450 L300,240 C320,180 400,180 460,240 L500,450 Z" fill="#ffffff"/>
      <circle cx="380" cy="120" r="55" fill="#f5d6c2"/>
      
      <!-- Gloved Hand holding PRP Glass Tube -->
      <ellipse cx="280" cy="270" rx="35" ry="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" transform="rotate(-10 280 270)"/>
      <!-- Centrifuge Vacutainer Glass Tube -->
      <rect x="285" y="160" width="28" height="150" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="3" opacity="0.95"/>
      <!-- Red Rubber Cap -->
      <rect x="283" y="152" width="32" height="22" rx="4" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
      <!-- Top Layer: Golden Yellow Platelet-Rich Plasma -->
      <rect x="288" y="180" width="22" height="60" fill="#eab308" opacity="0.95"/>
      <!-- Thin Buff layer / separation -->
      <line x1="288" y1="240" x2="310" y2="240" stroke="#fef08a" stroke-width="3"/>
      <!-- Bottom Layer: Concentrated Dark Red Blood Cells -->
      <rect x="288" y="242" width="22" height="62" rx="0 0 11 11" fill="#991b1b" opacity="0.95"/>

      <rect x="20" y="390" width="160" height="40" rx="20" fill="#0e392b" opacity="0.9"/>
      <text x="100" y="415" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">PRP THERAPY</text>
    
    </svg>