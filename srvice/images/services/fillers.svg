<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
      
      <rect width="600" height="450" fill="#f8f1ea"/>
      <!-- Close up Cheek & Mid-face -->
      <circle cx="270" cy="230" r="175" fill="#f5ded0"/>
      <!-- Eye & Lip profile -->
      <path d="M200,140 C230,130 260,135 280,150" stroke="#3b271d" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M210,290 C240,290 270,305 290,320" stroke="#991b1b" stroke-width="5" stroke-linecap="round" fill="none"/>

      <!-- Gloved Hand Stabilizing Cheek -->
      <ellipse cx="200" cy="220" rx="40" ry="25" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" transform="rotate(30 200 220)"/>
      <!-- Syringe delivering Dermal Filler into Zygomatic Area -->
      <path d="M490,90 L320,195" stroke="#cbd5e1" stroke-width="12" stroke-linecap="round"/>
      <line x1="320" y1="195" x2="305" y2="205" stroke="#94a3b8" stroke-width="3.5"/>
      <!-- Injector gloved hand -->
      <path d="M540,50 L480,100 L440,70 Z" fill="#ffffff"/>

      <rect x="20" y="390" width="160" height="40" rx="20" fill="#0e392b" opacity="0.9"/>
      <text x="100" y="415" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">DERMAL FILLERS</text>
    
    </svg>