<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
      
      <rect width="600" height="450" fill="#f7f0e8"/>
      <!-- Patient Face Close-up -->
      <circle cx="240" cy="270" r="160" fill="#f4dfcf"/>
      <path d="M80,180 C80,60 180,30 300,30 C380,40 390,130 390,190 Z" fill="#26160f"/>
      
      <!-- White Guideline Marks on Forehead -->
      <line x1="200" y1="175" x2="230" y2="165" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
      <line x1="250" y1="165" x2="280" y2="175" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
      <circle cx="215" cy="190" r="4" fill="#ffffff"/>
      <circle cx="265" cy="190" r="4" fill="#ffffff"/>

      <!-- Syringe Micro-Injection from Top Right -->
      <path d="M480,40 L300,165" stroke="#cbd5e1" stroke-width="12" stroke-linecap="round"/>
      <path d="M480,40 L380,110" stroke="#0e392b" stroke-width="6"/>
      <!-- Ultra-fine needle tip touching forehead -->
      <line x1="300" y1="165" x2="285" y2="175" stroke="#94a3b8" stroke-width="3"/>
      <!-- Gloved Doctor Fingers stabilizing forehead -->
      <ellipse cx="285" cy="145" rx="25" ry="15" fill="#ffffff" stroke="#e2e8f0" transform="rotate(-20 285 145)"/>

      <rect x="20" y="390" width="140" height="40" rx="20" fill="#0e392b" opacity="0.9"/>
      <text x="90" y="415" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">BOTOX</text>
    
    </svg>