<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
      
      <defs>
        <linearGradient id="eyeBg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#fff"/>
          <stop offset="100%" stop-color="#f0e4d7"/>
        </linearGradient>
      </defs>
      <rect width="600" height="450" fill="url(#eyeBg)"/>
      <!-- Close up face center -->
      <circle cx="280" cy="240" r="170" fill="#f3dccc"/>
      <path d="M110,130 C150,50 350,40 430,120 L450,220 L110,220 Z" fill="#2b1a11" opacity="0.95"/>
      
      <!-- Right Eye with Precision Surgical Markings -->
      <path d="M190,195 C230,170 300,170 340,205 C300,230 230,230 190,195 Z" fill="#ffffff"/>
      <circle cx="265" cy="198" r="28" fill="#4a6b82"/>
      <circle cx="265" cy="198" r="14" fill="#111827"/>
      <circle cx="258" cy="190" r="5" fill="#ffffff"/>
      <!-- Eyelid fold & surgical blue markings -->
      <path d="M175,185 C230,150 310,155 355,190" stroke="#1d4ed8" stroke-width="3.5" stroke-dasharray="5 5" fill="none"/>
      <path d="M185,215 C235,235 300,235 345,215" stroke="#1d4ed8" stroke-width="3" stroke-dasharray="4 4" fill="none"/>
      <!-- Eyebrow -->
      <path d="M170,145 C220,120 300,120 355,140 C310,135 230,135 170,145 Z" fill="#2b1a11"/>

      <!-- Surgeon in Blue Scrubs holding instrument on right -->
      <path d="M430,450 L430,180 C480,130 570,130 600,180 L600,450 Z" fill="#2563eb" opacity="0.9"/>
      <circle cx="530" cy="90" r="55" fill="#e8cfbd"/>
      <path d="M475,80 C475,40 520,30 570,40 L585,80 Z" fill="#1d4ed8"/>
      <!-- Marking Pen -->
      <line x1="365" y1="185" x2="460" y2="140" stroke="#1e40af" stroke-width="8" stroke-linecap="round"/>
      <polygon points="355,189 368,182 368,193" fill="#2563eb"/>

      <rect x="20" y="390" width="180" height="40" rx="20" fill="#0e392b" opacity="0.9"/>
      <text x="110" y="415" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">EYELID SURGERY</text>
    
    </svg>