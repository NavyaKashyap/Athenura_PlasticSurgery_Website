<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
      
      <rect width="600" height="450" fill="#f8f2ec"/>
      <!-- Wall Medical Poster -->
      <rect x="280" y="30" width="280" height="360" fill="#ffffff" stroke="#cbd5e1" stroke-width="4" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.06))"/>
      <text x="420" y="60" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0e392b" text-anchor="middle">Breast Lift Reconstruction</text>
      <!-- Diagrams on Poster -->
      <circle cx="350" cy="120" r="30" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
      <circle cx="480" cy="120" r="30" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
      <path d="M350,110 L350,85" stroke="#0e392b" stroke-width="3"/>
      <polygon points="350,80 345,90 355,90" fill="#0e392b"/>
      <path d="M480,110 L480,85" stroke="#0e392b" stroke-width="3"/>
      <polygon points="480,80 475,90 485,90" fill="#0e392b"/>

      <!-- Patient standing by chart -->
      <circle cx="170" cy="150" r="50" fill="#f5d6c2"/>
      <path d="M100,450 L100,270 C100,210 160,200 230,200 L270,450 Z" fill="#b9d6ce"/>
      <path d="M60,90 C120,40 220,50 240,150 L180,170 Z" fill="#382419"/>

      <rect x="20" y="390" width="160" height="40" rx="20" fill="#0e392b" opacity="0.9"/>
      <text x="100" y="415" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">BREAST LIFT</text>
    
    </svg>