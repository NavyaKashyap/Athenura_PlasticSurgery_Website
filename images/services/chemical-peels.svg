<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
      
      <rect width="600" height="450" fill="#f8f3ec"/>
      <!-- Patient Reclining with Spa Headband -->
      <ellipse cx="260" cy="260" rx="160" ry="130" fill="#f4dfcf"/>
      <!-- White Spa Headband -->
      <path d="M120,240 C140,160 380,160 400,240 L385,280 C360,200 160,200 135,280 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      <!-- Glowing treatment gel layer on face -->
      <path d="M190,260 C230,240 310,240 340,280 C310,330 230,330 190,290 Z" fill="#fef08a" opacity="0.3"/>

      <!-- Aesthetician in Gloves applying with Fan Brush -->
      <path d="M520,40 L360,190" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
      <!-- Fan Brush Bristles spreading solution on cheek -->
      <path d="M360,190 C345,185 330,195 320,210 C340,215 355,210 365,200 Z" fill="#fed7aa" stroke="#ca8a04" stroke-width="2"/>

      <rect x="20" y="390" width="160" height="40" rx="20" fill="#0e392b" opacity="0.9"/>
      <text x="100" y="415" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">CHEMICAL PEEL</text>
    
    </svg>