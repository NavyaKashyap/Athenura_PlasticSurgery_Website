<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
      
      <defs>
        <linearGradient id="flBg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#fdfbf9"/>
          <stop offset="100%" stop-color="#e2ece7"/>
        </linearGradient>
        <linearGradient id="blSkin" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#f7e5d8"/>
          <stop offset="100%" stop-color="#dfc3b0"/>
        </linearGradient>
        <linearGradient id="blHair" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#d8c593"/>
          <stop offset="100%" stop-color="#bba36b"/>
        </linearGradient>
      </defs>
      <rect width="600" height="450" fill="url(#flBg)"/>
      
      <!-- Doctor in white coat / blue scrubs (Right) -->
      <path d="M380,450 L380,220 C380,160 440,110 500,110 C560,110 600,150 600,220 L600,450 Z" fill="#2a5f78"/>
      <path d="M420,450 L420,240 C430,210 480,200 500,200 C520,200 570,210 580,240 L580,450 Z" fill="#ffffff"/>
      <!-- Doctor Face & Head -->
      <circle cx="500" cy="90" r="55" fill="#e0c2ab"/>
      <path d="M450,75 C450,45 480,30 520,30 C550,30 560,50 560,80 Z" fill="#3a2e26"/>
      
      <!-- Patient Blonde Woman (Left) -->
      <path d="M120,450 L120,300 C120,230 180,200 240,200 C300,200 340,240 340,300 L340,450 Z" fill="#c3d9d1"/>
      <circle cx="230" cy="150" r="65" fill="url(#blSkin)"/>
      <path d="M165,150 C160,80 200,60 250,60 C300,60 310,100 300,160 C270,100 210,100 165,150 Z" fill="url(#blHair)"/>
      
      <!-- Doctor's hand evaluating jawline -->
      <path d="M380,230 C330,220 290,210 265,200 C250,195 240,210 255,220 C275,230 310,240 350,260 Z" fill="#f5ede5"/>
      <!-- Vector Lift Arrows -->
      <path d="M260,180 C275,150 290,120 300,95" stroke="#0e392b" stroke-width="4" stroke-dasharray="6 4" stroke-linecap="round" fill="none"/>
      <polygon points="302,90 292,102 308,102" fill="#0e392b"/>

      <!-- Handheld Mirror -->
      <ellipse cx="290" cy="270" rx="45" ry="60" fill="#e8f3f0" stroke="#94a3b8" stroke-width="8"/>
      <rect x="286" y="325" width="8" height="60" rx="4" fill="#64748b"/>
      
      <rect x="20" y="390" width="160" height="40" rx="20" fill="#0e392b" opacity="0.9"/>
      <text x="100" y="415" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">FACELIFT</text>
    
    </svg>