<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="athenuraSwoosh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1dbbb4"/>
      <stop offset="60%" stop-color="#149688"/>
      <stop offset="100%" stop-color="#0f7a6f"/>
    </linearGradient>
    <style>
      .logo-main-text {
        font-family: 'Plus Jakarta Sans', 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 38px;
        fill: #14383c;
        letter-spacing: -0.5px;
      }
      .logo-sub-text {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 500;
        font-size: 10.5px;
        fill: #225157;
        letter-spacing: 0.22em;
      }
    </style>
  </defs>
  
  <!-- Stylized "A" with organic swoosh -->
  <g transform="translate(10, 8)">
    <!-- Main A Left Stem / Arc -->
    <path d="M12,48 C16,36 28,16 38,4 C40,1 43,1 45,4 C51,14 62,38 68,48 C69,50 67,52 65,52 C63,52 61,50 59,45 L54,34 C44,35 32,38 24,45 C20,49 15,52 11,52 C8,52 9,49 12,48 Z" fill="url(#athenuraSwoosh)"/>
    
    <!-- Crossbar and dynamic bottom swoosh under thenura -->
    <path d="M22,34 C45,28 75,27 105,32 C145,39 190,44 235,32 C242,30 248,34 242,37 C200,52 145,46 100,38 C68,32 42,35 22,40 C19,41 18,35 22,34 Z" fill="url(#athenuraSwoosh)"/>
    
    <!-- Central Inner A highlight loop -->
    <path d="M38,12 L48,31 C38,32 30,33 26,34 L38,12 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M38,15 L46,30 C39,30 33,31 29,32 Z" fill="#149688"/>
  </g>

  <!-- "thenura" text -->
  <text x="75" y="47" class="logo-main-text">thenura</text>

  <!-- Tagline "Code. Create. Innovate" -->
  <text x="77" y="65" class="logo-sub-text">Code. Create. Innovate</text>
</svg>